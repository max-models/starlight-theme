name: CI

# The notebook tool's tests, and the example site built with the reusable docs workflow, so a
# change to the theme is checked the way the projects will use it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --with nbformat --with pytest pytest tests

  example:
    uses: ./.github/workflows/docs.yml
    with:
      project-dir: example
      npm-lockfile: package-lock.json
      smoke-paths: |
        getting-started/installation/index.html
        tutorials/index.html
        tutorials/first-steps/index.html
        tutorials/first-steps/1.png
        tutorials/first-steps/first_steps.ipynb
        api/example_pkg/index.html
      # set to true (deploy-branch: main) once GitHub Pages is enabled for this repository
      deploy: false
