name: Docs

# The reusable build of a max-models docs site (docs/, Astro + Starlight with this theme):
# install the project, execute and convert the notebooks, build, smoke test, and deploy to
# GitHub Pages. The notebooks run in parallel, one job each (parallel-notebooks); their executed
# copies are cached between runs and passed to the build as artifacts. A project calls it from its own .github/workflows/docs.yml:
#
#   on:
#     push: { branches: ["main", "devel"] }
#     pull_request: { branches: ["main", "devel"] }
#     workflow_dispatch:
#   permissions: { contents: read, pages: write, id-token: write }
#   concurrency: { group: "docs-${{ github.ref }}", cancel-in-progress: true }
#   jobs:
#     docs:
#       uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.6.0
#       with:
#         stable-branch: main
#         smoke-paths: |
#           tutorials/shapes-and-node-masks/1.png
#           api/simgeometry/index.html
#
# A project with dependencies in private repositories passes a token that can read them:
#
#       secrets:
#         git-token: ${{ secrets.PRIVATE_REPOS_TOKEN }}
#
# The release branch (stable-branch, or main) and pull requests into it install the project with
# UV_NO_SOURCES, i.e. from PyPI only; every other build uses the project's [tool.uv.sources].
#
# Without stable-branch, a push to deploy-branch deploys that branch at <owner>.github.io/<repo>/
# (at the root for the <owner>.github.io repository itself). With stable-branch, a push to either
# branch builds both and deploys stable-branch there and deploy-branch at <repo>/dev/, with a stable/dev switch in the header (DOCS_CHANNEL, read by defineDocs).
#
# A site without pyproject.toml (e.g. the docs of shell tools) skips the Python install; it sets
# notebooks: false.

on:
  workflow_call:
    secrets:
      git-token:
        description: A token that can read the project's private dependencies (git URLs on github.com).
        required: false
    inputs:
      project-dir:
        description: The project root (pyproject.toml and docs/), relative to the repository.
        type: string
        default: "."
      npm-lockfile:
        description: The npm lockfile, relative to the repository (for the cache).
        type: string
        default: docs/package-lock.json
      python-version:
        type: string
        default: "3.12"
      node-version:
        type: string
        default: "22"
      extras:
        description: The optional dependencies to install, space separated.
        type: string
        default: docs
      apt-packages:
        description: System packages, e.g. "libopenmpi-dev openmpi-bin" for notebooks under MPI.
        type: string
        default: ""
      notebooks:
        description: Execute and convert the notebooks (failing on errors).
        type: boolean
        default: true
      parallel-notebooks:
        description: Run each notebook in its own job; false runs them one after another in the build.
        type: boolean
        default: true
      gallery:
        description: Run the example scripts and convert them into the gallery (failing on errors).
        type: boolean
        default: false
      xvfb:
        description: Run the notebooks and gallery examples under a virtual display (xvfb), e.g. for PyVista scenes.
        type: boolean
        default: false
      pre-build:
        description: Shell commands run in the project root after the notebooks, before the build.
        type: string
        default: ""
      smoke-paths:
        description: Files that must exist in docs/dist, one per line (e.g. "tutorials/index.html").
        type: string
        default: ""
      deploy:
        description: Deploy to GitHub Pages on a push to deploy-branch.
        type: boolean
        default: true
      deploy-branch:
        description: The branch deployed (at <repo>/dev/ when stable-branch is set).
        type: string
        default: devel
      stable-branch:
        description: The release branch, e.g. "main", deployed at <repo>/ next to deploy-branch.
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      deploy: ${{ steps.plan.outputs.deploy }}
      notebooks: ${{ steps.notebooks.outputs.matrix }}
      serial: ${{ steps.notebooks.outputs.serial || '[]' }}
    steps:
      - id: plan
        env:
          DEPLOY: ${{ inputs.deploy }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEV: ${{ inputs.deploy-branch }}
          STABLE: ${{ inputs.stable-branch }}
        run: |
          deploy=false
          if [ "$DEPLOY" = true ] && [ "$EVENT" != pull_request ]; then
            if [ "$REF" = "refs/heads/$DEV" ] || { [ -n "$STABLE" ] && [ "$REF" = "refs/heads/$STABLE" ]; }; then
              deploy=true
            fi
          fi
          if [ "$deploy" = true ] && [ -n "$STABLE" ]; then
            builds=$(jq -cn --arg stable "$STABLE" --arg dev "$DEV" '[
              {name: "stable", ref: $stable, channel: "stable", path: ""},
              {name: "dev", ref: $dev, channel: "dev", path: "dev/"}]')
          else
            builds='[{"name": "site", "ref": "", "channel": "", "path": ""}]'
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "deploy: $deploy, builds: $builds"

      # One job per (build, notebook), listed at the ref of each build with the theme that ref
      # installs. The listing needs only the theme's tools/notebooks.py and the standard library
      # (python3 of the runner). A ref whose theme cannot list them (older than 0.6.0, e.g. main
      # before its first release with it) runs its notebooks in its build, one after another.
      - uses: actions/checkout@v7
        if: inputs.notebooks && inputs.parallel-notebooks
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: inputs.notebooks && inputs.parallel-notebooks
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ inputs.npm-lockfile }}

      - id: notebooks
        if: inputs.notebooks && inputs.parallel-notebooks
        env:
          BUILDS: ${{ steps.plan.outputs.builds }}
          PROJECT: ${{ inputs.project-dir }}
        run: |
          matrix='[]'
          serial='[]'
          for build in $(jq -c '.[]' <<< "$BUILDS"); do
            name=$(jq -r .name <<< "$build")
            ref=$(jq -r .ref <<< "$build")
            if [ -n "$ref" ]; then git checkout -q "origin/$ref"; else git checkout -q "$GITHUB_SHA"; fi
            (cd "$PROJECT/docs" && npm ci --ignore-scripts --no-audit --no-fund > /dev/null)
            if slugs=$(cd "$PROJECT/docs" && DOCS_PYTHON=python3 npx starlight-notebooks list); then
              matrix=$(jq -c --argjson slugs "$slugs" --argjson build "$build" \
                '. + [$slugs[] | {build: $build.name, ref: $build.ref, slug: .}]' <<< "$matrix")
            else
              echo "$name: the theme cannot list the notebooks; running them in the build"
              serial=$(jq -c --arg name "$name" '. + [$name]' <<< "$serial")
            fi
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "notebooks: $matrix, serial builds: $serial"

  notebook:
    needs: plan
    if: needs.plan.outputs.notebooks != '' && needs.plan.outputs.notebooks != '[]'
    name: notebook (${{ matrix.build }}, ${{ matrix.slug }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.notebooks) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-dir }}
    env:
      DOCS_PYTHON: ${{ github.workspace }}/${{ inputs.project-dir }}/.venv/bin/python
      UV_NO_SOURCES: ${{ (matrix.ref || github.base_ref || github.ref_name) == (inputs.stable-branch || 'main') }}
      CACHE_DIR: ${{ inputs.project-dir }}/docs/.cache/notebooks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ inputs.npm-lockfile }}

      - name: Install system packages
        if: inputs.apt-packages != '' || inputs.xvfb
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }} ${{ inputs.xvfb && 'xvfb libgl1 libglx-mesa0' || '' }}

      - name: Let git read private repositories
        env:
          GIT_TOKEN: ${{ secrets['git-token'] }}
        run: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install the project
        run: |
          uv sync $(printf -- '--extra %s ' ${{ inputs.extras }})
          uv run python -m ipykernel install --user --name python3

      - name: Install the npm packages
        working-directory: ${{ inputs.project-dir }}/docs
        run: npm ci

      # The executed copy of an earlier run, reused when nothing it may depend on changed: the
      # notebooks, the Python sources and the locked dependencies. The tool still reruns the
      # notebook if its cells changed or the last run failed.
      - uses: actions/cache@v6
        with:
          path: ${{ env.CACHE_DIR }}/${{ matrix.slug }}.*
          key: notebook-${{ matrix.build }}-${{ matrix.slug }}-${{ hashFiles(format('{0}/**/*.ipynb', inputs.project-dir), format('{0}/**/*.py', inputs.project-dir), format('{0}/pyproject.toml', inputs.project-dir), format('{0}/uv.lock', inputs.project-dir)) }}

      - name: Execute the notebook
        working-directory: ${{ inputs.project-dir }}/docs
        env:
          RUN: ${{ inputs.xvfb && 'xvfb-run -a' || '' }}
        run: $RUN npx starlight-notebooks execute --only ${{ matrix.slug }}

      - uses: actions/upload-artifact@v7
        with:
          name: notebook-${{ matrix.build }}-${{ matrix.slug }}
          path: ${{ env.CACHE_DIR }}/${{ matrix.slug }}.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [plan, notebook]
    # the notebook jobs are skipped without notebooks; any of them failing fails the docs
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.notebook.result != 'failure' }}
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-dir }}
    env:
      DOCS_PYTHON: ${{ github.workspace }}/${{ inputs.project-dir }}/.venv/bin/python
      DOCS_CHANNEL: ${{ matrix.channel }}
      # the notebooks of this build ran in the notebook jobs
      PARALLEL: ${{ inputs.parallel-notebooks && !contains(fromJSON(needs.plan.outputs.serial), matrix.name) }}
      DOCS_STABLE_BRANCH: ${{ inputs.stable-branch }}
      # The release branch (stable-branch, else main) builds against PyPI only; anything else uses
      # the [tool.uv.sources] devel branches. The caller's env does not reach a reusable workflow.
      UV_NO_SOURCES: ${{ (matrix.ref || github.base_ref || github.ref_name) == (inputs.stable-branch || 'main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          # The newest release, not the runner's cached one: Astro raises its minimum often.
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ inputs.npm-lockfile }}

      - name: Install system packages
        if: inputs.apt-packages != '' || inputs.xvfb
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }} ${{ inputs.xvfb && 'xvfb libgl1 libglx-mesa0' || '' }}

      - name: Let git read private repositories
        env:
          GIT_TOKEN: ${{ secrets['git-token'] }}
        run: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      # a site without a Python project (no pyproject.toml), e.g. docs of shell tools
      - name: Install the project
        if: hashFiles(format('{0}/pyproject.toml', inputs.project-dir)) != ''
        run: |
          uv sync $(printf -- '--extra %s ' ${{ inputs.extras }})
          uv run python -m ipykernel install --user --name python3

      - name: Install the npm packages
        working-directory: ${{ inputs.project-dir }}/docs
        run: npm ci

      - uses: actions/download-artifact@v8
        if: inputs.notebooks && env.PARALLEL == 'true' && needs.notebook.result == 'success'
        with:
          pattern: notebook-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ inputs.project-dir }}/docs/.cache/notebooks

      - name: Execute and convert the notebooks
        if: inputs.notebooks
        working-directory: ${{ inputs.project-dir }}/docs
        env:
          RUN: ${{ inputs.xvfb && 'xvfb-run -a' || '' }}
        run: |
          # in parallel the notebook jobs ran them; convert --strict fails on any missing run
          if [ "$PARALLEL" != true ]; then $RUN npx starlight-notebooks execute; fi
          npx starlight-notebooks convert --strict

      - name: Run and convert the gallery examples
        if: inputs.gallery
        working-directory: ${{ inputs.project-dir }}/docs
        env:
          RUN: ${{ inputs.xvfb && 'xvfb-run -a' || '' }}
        run: |
          $RUN npx starlight-gallery execute
          npx starlight-gallery convert --strict

      - name: Project-specific steps
        if: inputs.pre-build != ''
        run: ${{ inputs.pre-build }}

      - name: Build the site
        working-directory: ${{ inputs.project-dir }}/docs
        env:
          # the latest release for the badge of the home page, from the GitHub API
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx starlight-check-mdx
          npx astro build

      - name: Smoke test the built site
        working-directory: ${{ inputs.project-dir }}/docs
        env:
          SMOKE_PATHS: ${{ inputs.smoke-paths }}
          # a user or organisation site (<owner>.github.io) is served at the root
          BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}${{ matrix.path }}
        run: |
          missing=0
          for path in index.html $SMOKE_PATHS; do
            test -f "dist/$path" || { echo "missing dist/$path"; missing=1; }
          done
          grep -q "href=\"$BASE" dist/index.html || { echo "links do not use the base path $BASE"; missing=1; }
          exit $missing

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.name }}
          path: ${{ inputs.project-dir }}/docs/dist
          retention-days: 1

  # Assemble the pages from the builds and check them, on pull requests too, so a broken
  # assembly fails before anything is deployed.
  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: builds

      # the stable (or only) build at the root, the dev build in dev/. With one build the
      # download action extracts it into builds/ itself, with several into builds/site-<name>/.
      - name: Assemble the site
        run: |
          mkdir site
          if [ -d builds/site-dev ]; then
            cp -R builds/site-stable/. site/
            mkdir site/dev
            cp -R builds/site-dev/. site/dev/
          elif [ -d builds/site-site ]; then
            cp -R builds/site-site/. site/
          else
            cp -R builds/. site/
          fi

      - name: Check the assembled site
        env:
          SMOKE_PATHS: ${{ inputs.smoke-paths }}
          STABLE: ${{ inputs.stable-branch }}
          DEPLOY: ${{ needs.plan.outputs.deploy }}
        run: |
          missing=0
          prefixes=""
          # the dev build exists only when deploying with a stable branch
          if [ "$DEPLOY" = true ] && [ -n "$STABLE" ]; then prefixes="dev/"; fi
          for prefix in "" $prefixes; do
            for path in index.html $SMOKE_PATHS; do
              test -f "site/$prefix$path" || { echo "missing site/$prefix$path"; missing=1; }
            done
          done
          echo "$(find site -type f | wc -l) files in the assembled site"
          exit $missing

      - uses: actions/upload-pages-artifact@v5
        if: needs.plan.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: [plan, assemble]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # the pages must answer once deployed (an empty or missing site is a 404)
      - name: Check the deployed site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          STABLE: ${{ inputs.stable-branch }}
        run: |
          for path in index.html ${STABLE:+dev/index.html}; do
            curl --fail --silent --show-error --location --output /dev/null \
              --retry 12 --retry-delay 10 --retry-all-errors "${URL%/}/$path"
          done
