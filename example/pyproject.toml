# A stand-in project for the example site: a small package for the API reference and the
# Python side of the notebook tool (uv sync --extra docs).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-pkg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]
optional-dependencies.docs = ["griffe", "ipykernel", "matplotlib", "nbclient>=0.11", "nbformat>=5.11.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/example_pkg"]
